apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    rule_files:
      - /etc/prometheus/rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - "alertmanager.monitoring.svc.cluster.local:9093"

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - "localhost:9090"

      - job_name: food-ordering
        metrics_path: /metrics
        bearer_token_file: /etc/prometheus/metrics-auth/token
        static_configs:
          - targets:
              - "food-ordering.food-ordering.svc.cluster.local:8000"

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - "kube-state-metrics.monitoring.svc.cluster.local:8080"

      - job_name: kubernetes-nodes-cadvisor
        scheme: https
        metrics_path: /metrics/cadvisor
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443

          - source_labels:
              - __meta_kubernetes_node_name
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

          - source_labels:
              - __meta_kubernetes_node_name
            target_label: node

  rules.yml: |
    groups:
      - name: food-ordering
        rules:
          - alert: ApplicationUnavailable
            expr: up{job="food-ordering"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Food ordering API metrics endpoint is unavailable.

          - alert: ElevatedHttp5xxRate
            expr: |
              sum(rate(food_ordering_http_requests_total{status=~"5.."}[5m]))
              /
              clamp_min(sum(rate(food_ordering_http_requests_total[5m])), 0.001) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: More than 5% of HTTP requests are returning 5xx responses.

          - alert: ElevatedHttpLatency
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (
                  rate(food_ordering_http_request_duration_seconds_bucket[5m])
                )
              ) > 2
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Application p95 request latency is above 2 seconds.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    route:
      receiver: default
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1

  selector:
    matchLabels:
      app: alertmanager

  template:
    metadata:
      labels:
        app: alertmanager

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.28.1

          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager

          ports:
            - name: http
              containerPort: 9093

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager

            - name: data
              mountPath: /alertmanager

      volumes:
        - name: config
          configMap:
            name: alertmanager-config

        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager

  ports:
    - name: http
      port: 9093
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      serviceAccountName: prometheus

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.2.1

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle

          ports:
            - name: http
              containerPort: 9090

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus

            - name: data
              mountPath: /prometheus

            - name: metrics-auth
              mountPath: /etc/prometheus/metrics-auth
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: prometheus-config

        - name: data
          emptyDir:
            sizeLimit: 8Gi

        - name: metrics-auth
          secret:
            secretName: prometheus-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus

  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1

  selector:
    matchLabels:
      app: kube-state-metrics

  template:
    metadata:
      labels:
        app: kube-state-metrics

    spec:
      automountServiceAccountToken: true
      serviceAccountName: kube-state-metrics

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.15.0

          ports:
            - name: metrics
              containerPort: 8080

          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  selector:
    app: kube-state-metrics

  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  food-ordering-overview.json: |
    {
      "title": "Food Ordering Overview",
      "uid": "food-ordering-overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP requests / second",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum by (status) (rate(food_ordering_http_requests_total[5m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP p95 latency",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(food_ordering_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "5xx responses / second",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum(rate(food_ordering_http_requests_total{status=~\"5..\"}[5m]))",
              "legendFormat": "5xx"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Container CPU cores",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"food-ordering\",container!=\"\",container!=\"POD\"}[5m]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Container memory bytes",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"food-ordering\",container!=\"\",container!=\"POD\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Ready application pods",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 16
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"food-ordering\",deployment=\"food-ordering\"}",
              "legendFormat": "ready replicas"
            }
          ]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true

  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: food-ordering
        orgId: 1
        folder: Food Ordering
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1

  selector:
    matchLabels:
      app: grafana

  template:
    metadata:
      labels:
        app: grafana

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: grafana
          image: grafana/grafana:11.6.0

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password

            - name: GF_PATHS_PROVISIONING
              value: /etc/grafana/provisioning

          readinessProbe:
            httpGet:
              path: /api/health
              port: http

          livenessProbe:
            httpGet:
              path: /api/health
              port: http

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml

            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml

            - name: dashboards
              mountPath: /var/lib/grafana/dashboards

            - name: tmp
              mountPath: /tmp

            - name: data
              mountPath: /var/lib/grafana

      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning

        - name: dashboards
          configMap:
            name: grafana-dashboards

        - name: tmp
          emptyDir: {}

        - name: data
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana

  ports:
    - name: http
      port: 3000
      targetPort: http
