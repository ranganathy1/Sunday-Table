name: Deploy learning stack

on:
  workflow_dispatch:
    inputs:
      deploy_to_aws:
        description: Push the image to ECR and deploy workloads to EKS
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./backend[dev]"

      - name: Lint backend
        run: ruff check backend/app backend/scripts backend/tests

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Run frontend tests when configured
        run: npm test --if-present --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: Format and validate Terraform
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform validate

      - name: Build Docker image
        run: docker build --pull --tag sunday-table:ci .

  deploy:
    name: Optional AWS deployment
    needs: checks
    if: ${{ inputs.deploy_to_aws }}
    runs-on: ubuntu-latest
    environment: aws-learning

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY_URI: ${{ vars.ECR_REPOSITORY_URI }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      APP_CONFIG_PARAMETER: ${{ vars.APP_CONFIG_PARAMETER }}

    steps:
      - uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          token="$(
            curl -sSf \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["value"])'
          )"

          python - "$token" <<'PY'
          import base64
          import json
          import sys

          token = sys.argv[1]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("OIDC issuer:", claims.get("iss"))
          print("OIDC audience:", claims.get("aud"))
          print("OIDC subject:", claims.get("sub"))
          PY

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push immutable application image
        shell: bash
        run: |
          set -euo pipefail

          image_uri="${ECR_REPOSITORY_URI}:${GITHUB_SHA}"

          docker build --pull --tag "$image_uri" .
          docker push "$image_uri"

          echo "IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Configure Kubernetes access
        shell: bash
        run: |
          set -euo pipefail

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Deploy application and monitoring
        shell: bash
        run: |
          set -euo pipefail

          ci/deploy.sh